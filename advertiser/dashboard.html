<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Advertiser — QA Konten</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #eae8f5; min-height: 100vh; }
    nav {
      background: #fff; padding: 14px 28px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 1px 0 #e5e3f5; position: sticky; top: 0; z-index: 10;
    }
    .nav-logo { font-size: 18px; font-weight: 800; color: #4f46e5; text-decoration: none; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .nav-user { font-size: 14px; color: #374151; font-weight: 500; }
    .nav-btn { padding: 8px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; transition: all 0.2s; }
    .nav-btn.solid { background: #4f46e5; color: #fff; }
    .nav-btn.solid:hover { background: #4338ca; }
    .nav-btn.ghost { background: none; color: #9ca3af; }
    .nav-btn.ghost:hover { color: #dc2626; }
    .page { padding: 32px 24px; max-width: 900px; margin: 0 auto; }
    h2 { font-size: 20px; font-weight: 700; color: #1e1e2e; margin-bottom: 6px; }
    .page-sub { font-size: 13px; color: #9ca3af; margin-bottom: 24px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
    .stat-card { background: #fff; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 2px 12px rgba(80,70,160,0.07); }
    .stat-num { font-size: 28px; font-weight: 800; color: #1e1e2e; }
    .stat-label { font-size: 12px; color: #9ca3af; margin-top: 4px; font-weight: 500; }
    .stat-pct { font-size: 12px; font-weight: 700; margin-top: 4px; }
    .stat-card.pending .stat-num { color: #d97706; }
    .stat-card.pending .stat-pct { color: #d97706; }
    .stat-card.approved .stat-num { color: #16a34a; }
    .stat-card.approved .stat-pct { color: #16a34a; }
    .stat-card.rejected .stat-num { color: #dc2626; }
    .stat-card.rejected .stat-pct { color: #dc2626; }

    /* Notif */
    .notif-banner { background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 12px; padding: 14px 18px; margin-bottom: 20px; display: none; }
    .notif-item { font-size: 13px; color: #92400e; padding: 4px 0; border-bottom: 1px solid #fef3c7; }
    .notif-item:last-child { border-bottom: none; }

    /* List */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .section-title { font-size: 16px; font-weight: 700; color: #1e1e2e; }
    .filter-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-btn { padding: 7px 16px; border-radius: 20px; border: 1.5px solid #e5e3f5; background: #fff; font-size: 12px; font-weight: 600; cursor: pointer; color: #6b7280; transition: all 0.2s; }
    .filter-btn.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }
    .filter-select { padding: 7px 14px; border-radius: 20px; border: 1.5px solid #e5e3f5; background: #fff; font-size: 12px; font-weight: 600; cursor: pointer; color: #6b7280; outline: none; font-family: inherit; }
    .filter-select:focus { border-color: #4f46e5; color: #4f46e5; }

    .submissions { display: flex; flex-direction: column; gap: 14px; }
    .submission-card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(80,70,160,0.07); border-left: 4px solid #e5e3f5; }
    .submission-card.pending { border-left-color: #d97706; }
    .submission-card.approved { border-left-color: #16a34a; }
    .submission-card.rejected { border-left-color: #dc2626; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .card-judul { font-size: 15px; font-weight: 700; color: #1e1e2e; }
    .card-brand { font-size: 12px; color: #9ca3af; margin-top: 2px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .badge.pending { background: #fffbeb; color: #d97706; }
    .badge.approved { background: #f0fdf4; color: #16a34a; }
    .badge.rejected { background: #fef2f2; color: #dc2626; }
    .card-meta { display: flex; gap: 16px; font-size: 12px; color: #9ca3af; flex-wrap: wrap; }
    .card-meta span { display: flex; align-items: center; gap: 4px; }
    .card-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .btn-sm { padding: 7px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; text-decoration: none; display: inline-block; }
    .btn-sm.outline { border: 1.5px solid #c7c2f5; color: #4f46e5; background: #f5f4fb; }
    .btn-sm.outline:hover { background: #eceaf8; }
    .btn-sm.danger { border: 1.5px solid #fecaca; color: #dc2626; background: #fef2f2; }
    .catatan-qa { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 13px; color: #7f1d1d; }
    .catatan-qa strong { display: block; margin-bottom: 4px; color: #dc2626; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
    .approved-info { background: #f0fdf4; border: 1px solid #86efac; border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 13px; color: #14532d; }
    .approved-info strong { display: block; margin-bottom: 4px; color: #16a34a; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
    .revision-chain { background: #f5f4fb; border-radius: 10px; padding: 10px 14px; margin-top: 10px; font-size: 12px; color: #6b7280; }
    .revision-chain strong { color: #4f46e5; }

    .empty { text-align: center; padding: 60px 20px; color: #9ca3af; font-size: 14px; }
    .loading { text-align: center; padding: 40px; color: #9ca3af; font-size: 14px; }

    @media (max-width: 600px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="dashboard.html">QA Konten</a>
    <div class="nav-right">
      <span class="nav-user" id="navUser"></span>
      <a href="submit.html" class="nav-btn solid">+ Submit Konten</a>
      <button class="nav-btn ghost" onclick="doLogout()">Keluar</button>
    </div>
  </nav>

  <div class="page">
    <h2>Dashboard Advertiser</h2>
    <p class="page-sub">Pantau status konten yang kamu submit ke QA.</p>

    <!-- Notif banner -->
    <div class="notif-banner" id="notifBanner">
      <div id="notifList"></div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">-</div>
        <div class="stat-label">Total Submit</div>
        <div class="stat-pct" id="pctTotal" style="color:#9ca3af">100%</div>
      </div>
      <div class="stat-card pending">
        <div class="stat-num" id="statPending">-</div>
        <div class="stat-label">Pending</div>
        <div class="stat-pct" id="pctPending">-</div>
      </div>
      <div class="stat-card approved">
        <div class="stat-num" id="statApproved">-</div>
        <div class="stat-label">Approved</div>
        <div class="stat-pct" id="pctApproved">-</div>
      </div>
      <div class="stat-card rejected">
        <div class="stat-num" id="statRejected">-</div>
        <div class="stat-label">Rejected</div>
        <div class="stat-pct" id="pctRejected">-</div>
      </div>
    </div>

    <!-- Filter -->
    <div class="section-header">
      <div class="section-title">Submisi Konten</div>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('all', this)">Semua</button>
      <button class="filter-btn" onclick="setFilter('pending', this)">Pending</button>
      <button class="filter-btn" onclick="setFilter('approved', this)">Approved</button>
      <button class="filter-btn" onclick="setFilter('rejected', this)">Rejected</button>
      <select class="filter-select" id="filterJenis" onchange="renderList()">
        <option value="">Semua Jenis</option>
        <option value="Foto Produk">Foto Produk</option>
        <option value="Video Produk">Video Produk</option>
        <option value="Video Iklan">Video Iklan</option>
        <option value="Desain Konten">Desain Konten</option>
      </select>
      <select class="filter-select" id="filterProduk" onchange="renderList()">
        <option value="">Semua Produk</option>
      </select>
    </div>

    <div class="submissions" id="submissionList">
      <div class="loading">Memuat data...</div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const { supabaseUrl, supabaseAnonKey } = await fetch('/api/config').then(r => r.json());
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    let allData = [];
    let currentFilter = 'all';

    supabase.auth.getSession().then(async ({ data }) => {
      if (!data.session || data.session.user.user_metadata?.role !== 'advertiser') {
        window.location.href = 'login.html'; return;
      }
      const user = data.session.user;
      document.getElementById('navUser').textContent = 'Hi, ' + (user.user_metadata?.name || 'Advertiser');
      await loadData(user.id);
    });

    async function loadData(userId) {
      const { data, error } = await supabase
        .from('content_submissions')
        .select('*')
        .eq('advertiser_id', userId)
        .order('submitted_at', { ascending: false });

      if (error) { document.getElementById('submissionList').innerHTML = '<div class="empty">Gagal memuat data.</div>'; return; }

      allData = data || [];
      updateStats();
      renderNotif();
      loadProdukFilter();
      renderList();
    }

    async function loadProdukFilter() {
      const { data } = await supabase.from('products').select('nama').order('nama');
      const sel = document.getElementById('filterProduk');
      sel.innerHTML = '<option value="">Semua Produk</option>';
      (data || []).forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.nama; opt.textContent = p.nama;
        sel.appendChild(opt);
      });
    }

    function pct(num, total) {
      if (!total) return '0%';
      return Math.round(num / total * 100) + '%';
    }

    function updateStats() {
      const total = allData.length;
      const pending = allData.filter(d => d.status === 'pending').length;
      const approved = allData.filter(d => d.status === 'approved').length;
      const rejected = allData.filter(d => d.status === 'rejected').length;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statApproved').textContent = approved;
      document.getElementById('statRejected').textContent = rejected;

      document.getElementById('pctTotal').textContent = total + ' konten';
      document.getElementById('pctPending').textContent = pct(pending, total);
      document.getElementById('pctApproved').textContent = pct(approved, total);
      document.getElementById('pctRejected').textContent = pct(rejected, total);
    }

    function renderNotif() {
      const recent = allData.filter(d => {
        if (!d.qa_at) return false;
        const diff = Date.now() - new Date(d.qa_at).getTime();
        return diff < 48 * 3600 * 1000 && (d.status === 'rejected' || d.status === 'approved');
      });
      if (recent.length === 0) return;
      document.getElementById('notifBanner').style.display = 'block';
      document.getElementById('notifList').innerHTML = recent.map(d => {
        const icon = d.status === 'rejected' ? '❌' : '✅';
        const label = d.status === 'rejected' ? 'Tidak Di-acc' : 'Approved';
        return `<div class="notif-item">${icon} <strong>${d.judul}</strong> — ${label}${d.qa_catatan ? ': ' + d.qa_catatan : ''}</div>`;
      }).join('');
    }

    window.setFilter = function(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderList();
    };

    function renderList() {
      const filterJenis = document.getElementById('filterJenis').value;
      const filterProduk = document.getElementById('filterProduk').value;
      let filtered = currentFilter === 'all' ? allData : allData.filter(d => d.status === currentFilter);
      if (filterJenis) filtered = filtered.filter(d => d.jenis_konten === filterJenis);
      if (filterProduk) filtered = filtered.filter(d => d.brand === filterProduk);
      const container = document.getElementById('submissionList');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty">Belum ada submisi di kategori ini.</div>';
        return;
      }
      container.innerHTML = filtered.map(d => renderCard(d)).join('');
    }

    function badgeLabel(status) {
      return { pending: 'Pending', approved: 'Approved', rejected: 'Rejected' }[status] || status;
    }

    function formatDate(str) {
      if (!str) return '-';
      return new Date(str).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderCard(d) {
      const revisionInfo = d.revision_of
        ? `<div class="revision-chain"><strong>Revisi ${d.revision_number}</strong> dari submisi sebelumnya</div>` : '';
      const catatanQA = d.qa_catatan && d.status === 'rejected'
        ? `<div class="catatan-qa"><strong>Catatan QA</strong>${d.qa_catatan}</div>` : '';
      const approvedInfo = d.status === 'approved'
        ? `<div class="approved-info"><strong>✅ Konten Disetujui</strong>Konten telah lolos review QA dan bisa digunakan untuk iklan.${d.qa_catatan ? '<br>' + d.qa_catatan : ''}</div>` : '';
      const actions = d.status === 'rejected'
        ? `<a href="submit.html?revisi=${d.id}" class="btn-sm danger">Resubmit / Revisi</a>
           <a href="${d.drive_link}" target="_blank" class="btn-sm outline">Lihat Konten</a>`
        : `<a href="${d.drive_link}" target="_blank" class="btn-sm outline">Lihat Konten</a>`;

      return `
        <div class="submission-card ${d.status}">
          <div class="card-top">
            <div>
              <div class="card-judul">${d.judul}</div>
              <div class="card-brand">${d.brand} · ${d.jenis_konten}</div>
            </div>
            <span class="badge ${d.status}">${badgeLabel(d.status)}</span>
          </div>
          <div class="card-meta">
            <span>📅 ${formatDate(d.submitted_at)}</span>
            ${d.qa_at ? `<span>🔍 Direview: ${formatDate(d.qa_at)}</span>` : ''}
            ${d.qa_by ? `<span>👤 QA: ${d.qa_by}</span>` : ''}
          </div>
          ${revisionInfo}
          ${catatanQA}
          ${approvedInfo}
          <div class="card-actions">${actions}</div>
        </div>`;
    }

    window.doLogout = async function() {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    };
  </script>
</body>
</html>
